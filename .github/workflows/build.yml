name: Build Android APK
on:
   push:
       branches: [ "main" ]
  jobs:
  build:
  runs-on: ubuntu-latest
  steps:
  - name: checkout Code
  uses: actions/checkout@v4
  - name: Set up JDK 17 S
  uses: actions/setup-java@v5
with:
distributton: 'temurn'
java-version; '17'
- name: Setup Gradle
uses: Generate Gradle wrapper
run: gradle Wapper --gradle-version 8.5
- name: Grandle execute permission for gradlew
run: chmod +x gradlew
-name: Build Debug APK
run: ./gradlew assembledebug
-name: Unload APK Artifact
uses: actions/upload-artifact@v4
with:
 name: app-debug
 path: app/build/outputs/apk/debug/*.apk









  
